name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Confirm there are no runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.requires("sun-track") or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert not runtime, f"unexpected runtime dependencies: {runtime}"
          print("no runtime dependencies")
          PY
